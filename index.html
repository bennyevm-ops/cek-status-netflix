<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Status Netflix</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#07070b; color:#f2f2f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height:100vh; padding: 34px 16px 56px; overflow-x:hidden; position:relative; }
  body::before, body::after { content:""; position:fixed; border-radius:50%; filter: blur(90px); z-index:-1; }
  body::before { width:520px; height:520px; background:rgba(229,9,20,.28); top:-180px; left:-120px; animation: drift 14s ease-in-out infinite alternate; }
  body::after { width:460px; height:460px; background:rgba(120,40,220,.20); bottom:-200px; right:-100px; animation: drift 18s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(50px,36px) scale(1.12); } }
  .wrap { max-width: 1120px; margin: 0 auto; }
  header { text-align:center; }
  .logo { display:inline-flex; align-items:center; gap:10px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.10); padding:7px 14px; border-radius:999px; font-size:12px; letter-spacing:2px; color:#ffb3b8; }
  .logo .dot { width:8px; height:8px; border-radius:50%; background:#ff2e2e; animation:pulse 1.4s ease-in-out infinite; }
  h1 { font-size: clamp(32px, 6vw, 52px); font-weight:900; letter-spacing:.2px; margin-top:16px; line-height:1.05; }
  h1 .grad { background: linear-gradient(92deg, #ff3d47, #e50914 45%, #ff7a45); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:#b9b9c4; font-size:15px; margin-top:10px; }
  #clock { display:inline-block; margin-top:14px; font-variant-numeric: tabular-nums; color:#e8e8ee; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10); border-radius:10px; padding:6px 12px; font-size:13px; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin: 22px 0 26px; }
  .chip { background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:10px 16px; font-size:14px; color:#d9d9e0; }
  .chip b { color:#fff; font-size:16px; }
  .chip.hot b { color:#ffb020; }
  #cards { display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; align-items:start; }
  @media (max-width: 860px) { #cards { grid-template-columns: 1fr; } }
  .card { position:relative; background: linear-gradient(165deg, #1a1a23, #101016 60%); border:1px solid rgba(255,255,255,.10); border-radius:18px; padding:20px; overflow:hidden; animation: rise .6s ease both; transition: transform .25s ease, border-color .25s ease; }
  .card:hover { transform: translateY(-4px); border-color: rgba(229,9,20,.55); }
  .card::before { content:""; position:absolute; inset:0 0 auto 0; height:3px; background: linear-gradient(90deg, #e50914, #ff7a45); }
  @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  .row1 { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .slot { font-size:22px; font-weight:800; }
  .badge { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:800; letter-spacing:1.5px; color:#ff5b5b; border:1px solid rgba(255,60,60,.45); background:rgba(229,9,20,.14); padding:6px 11px; border-radius:999px; box-shadow: 0 0 18px rgba(229,9,20,.25); }
  .badge .dot { width:8px; height:8px; border-radius:50%; background:#ff2e2e; animation:pulse 1.4s ease-in-out infinite; }
  .badge.off { color:#9a9aa5; border-color:#33333c; background:#1b1b22; box-shadow:none; }
  .badge.off .dot { background:#77777f; animation:none; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin-top:16px; font-size:14px; }
  .k { color:#8e8e99; font-size:11px; text-transform:uppercase; letter-spacing:1px; }
  .v { margin-top:3px; color:#f2f2f5; font-weight:600; word-break:break-all; }
  .count { margin-top:18px; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:14px; text-align:center; }
  .count .num { font-size:44px; font-weight:900; line-height:1; background: linear-gradient(180deg, #ffffff, #cfcfda); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .count .lbl { color:#a7a7b3; font-size:12px; margin-top:5px; letter-spacing:.4px; }
  .count.warn .num { background: linear-gradient(180deg, #ffd98a, #ffb020); -webkit-background-clip:text; background-clip:text; }
  .count.crit .num { background: linear-gradient(180deg, #ffb3b3, #ff2e2e); -webkit-background-clip:text; background-clip:text; }
  .count.dead .num { background: linear-gradient(180deg, #ff9a9a, #ff4d4d); -webkit-background-clip:text; background-clip:text; font-size:32px; }
  .bar { height:9px; border-radius:99px; background:rgba(255,255,255,.08); margin-top:14px; overflow:hidden; }
  .bar > i { display:block; height:100%; border-radius:99px; background: linear-gradient(90deg, #e50914, #ff7a45); transition: width 1s ease; }
  .bar.warn > i { background: linear-gradient(90deg, #ffb020, #ff7a45); }
  .bar.crit > i { background: linear-gradient(90deg, #ff2e2e, #ff7a45); }
  .bar.dead > i { background:#ff4d4d; }
  .card.crit { border-color: rgba(255,46,46,.65); box-shadow: 0 0 26px rgba(229,9,20,.35); }
  .crit-banner { margin-top:14px; border:1px solid rgba(255,46,46,.6); background:rgba(229,9,20,.16); color:#ffb3b3; font-size:13px; font-weight:700; text-align:center; padding:10px 12px; border-radius:12px; animation:pulse 1.6s ease-in-out infinite; }
  .barlbl { display:flex; justify-content:space-between; color:#8e8e99; font-size:11px; margin-top:6px; }
  footer { text-align:center; color:#77777f; font-size:12px; margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo"><span class="dot"></span> PANTAUAN SLOT &middot; REALTIME</span>
    <h1>Cek Status <span class="grad">Netflix</span></h1>
    <p class="sub">Pantau masa aktif slot kamu di sini &mdash; update otomatis tiap hari.</p>
    <div><span id="clock"></span></div>
  </header>
  <div class="chips" id="summary"></div>
  <main id="cards"></main>
  <footer>Halaman pantauan resmi untuk pembeli. Simpan link ini untuk cek status kapan saja.</footer>
</div>
<script>
  var FALLBACK = [
    {"label":"TV 1","holder":"Cak Ali","email":"ri***@riznetflik.my.id","profile":"CAK ALI","expiry":"2026-12-17","status":"LIVE"},
    {"label":"TV 2","holder":"Cak Ali","email":"sa***@gmail.com","profile":"CAK ALI","expiry":"2026-12-07","status":"LIVE"},
    {"label":"TV 3","holder":"Cak Ali","email":"tx***@gmail.com","profile":"CAK ALI","expiry":"2026-12-07","status":"LIVE"}
  ];
  var PERIOD = 30;
  function daysLeft(iso) {
    var now = new Date(); var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var p = iso.split("-"); var exp = new Date(+p[0], +p[1]-1, +p[2]);
    return Math.round((exp - today) / 86400000);
  }
  function fmtDate(iso) {
    var bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    var p = iso.split("-");
    return (+p[2]) + " " + bulan[+p[1]-1] + " " + p[0];
  }
  function render(slots) {
    var main = document.getElementById("cards");
    var aktif = 0, nearest = null, nearestLabel = "";
    main.innerHTML = "";
    slots.forEach(function(s, idx) {
      var live = (s.status || "LIVE").toUpperCase() === "LIVE";
      if (live) aktif++;
      var d = daysLeft(s.expiry);
      if (nearest === null || d < nearest) { nearest = d; nearestLabel = s.label; }
      var state = d < 0 ? "dead" : (d <= 3 ? "crit" : (d <= 7 ? "warn" : ""));
      var pct = Math.max(0, Math.min(100, Math.round(d / PERIOD * 100)));
      var countHtml = d < 0
        ? '<div class="num">EXPIRED</div><div class="lbl">sudah lewat ' + Math.abs(d) + ' hari</div>'
        : '<div class="num">' + d + '</div><div class="lbl">hari lagi menuju berakhir</div>';
      var card = document.createElement("section");
      card.className = "card" + (state === "crit" || state === "dead" ? " crit" : "");
      card.style.animationDelay = (idx * 0.12) + "s";
      card.innerHTML =
        '<div class="row1"><span class="slot">' + s.label + '</span>' +
        '<span class="badge' + (live ? "" : " off") + '"><span class="dot"></span>' + (live ? "LIVE" : "OFF") + '</span></div>' +
        '<div class="grid">' +
        '<div><div class="k">Pemegang</div><div class="v">' + s.holder + '</div></div>' +
        '<div><div class="k">Profil</div><div class="v">' + s.profile + '</div></div>' +
        '<div><div class="k">Email</div><div class="v">' + s.email + '</div></div>' +
        '<div><div class="k">Berakhir</div><div class="v">' + fmtDate(s.expiry) + '</div></div>' +
        '</div>' +
        '<div class="count ' + state + '">' + countHtml + '</div>' +
        '<div class="bar ' + state + '"><i style="width:' + pct + '%"></i></div>' +
        '<div class="barlbl"><span>Sisa masa aktif</span><span>' + (d < 0 ? 0 : pct) + '%</span></div>' +
        (state === "crit" ? '<div class="crit-banner">⚠️ SISA ' + d + ' HARI — segera hubungi penjual untuk perpanjang sebelum slot mati</div>' : '') +
        (state === "dead" ? '<div class="crit-banner">⛔ SLOT SUDAH BERAKHIR — hubungi penjual untuk perpanjang</div>' : '');
      main.appendChild(card);
    });
    document.getElementById("summary").innerHTML =
      '<span class="chip"><b>' + aktif + ' / ' + slots.length + '</b>&nbsp; slot aktif</span>' +
      (nearest !== null ? '<span class="chip hot">Exp terdekat: <b>' + nearestLabel + '</b>&nbsp; ' + (nearest < 0 ? 'sudah lewat' : nearest + ' hari lagi') + '</span>' : '');
  }
  function tick() {
    var n = new Date();
    var pad = function(x){ return (x<10?"0":"") + x; };
    document.getElementById("clock").textContent =
      pad(n.getDate()) + "/" + pad(n.getMonth()+1) + "/" + n.getFullYear() + "  " +
      pad(n.getHours()) + ":" + pad(n.getMinutes()) + ":" + pad(n.getSeconds()) + " WIB";
  }
  tick(); setInterval(tick, 1000);
  fetch("slots.json", {cache: "no-store"})
    .then(function(r){ if (!r.ok) throw new Error("no json"); return r.json(); })
    .then(render)
    .catch(function(){ render(FALLBACK); });
</script>
</body>
</html>
