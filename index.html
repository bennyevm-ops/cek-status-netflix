<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Status Netflix</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#0b0b0f; color:#f2f2f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height:100vh; padding: 28px 16px 48px; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  #cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 860px) { #cards { grid-template-columns: 1fr; } }
  header { text-align:center; margin-bottom: 8px; }
  h1 { font-size: 26px; letter-spacing:.3px; }
  h1 .n { color:#e50914; }
  .sub { color:#a7a7b3; font-size: 14px; margin-top:6px; }
  .summary { text-align:center; color:#d7d7de; font-size:14px; margin: 14px 0 22px; }
  .summary b { color:#fff; }
  .card { background:#15151c; border:1px solid #26262f; border-radius:14px; padding:18px; }
  .row1 { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .slot { font-size:20px; font-weight:700; }
  .badge { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; letter-spacing:1px; color:#ff4d4d; border:1px solid #5a1d20; background:#2a1214; padding:5px 10px; border-radius:999px; }
  .badge .dot { width:8px; height:8px; border-radius:50%; background:#ff2e2e; animation:pulse 1.4s ease-in-out infinite; }
  .badge.off { color:#9a9aa5; border-color:#33333c; background:#1b1b22; }
  .badge.off .dot { background:#77777f; animation:none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-top:14px; font-size:14px; }
  .k { color:#8e8e99; font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
  .v { margin-top:2px; color:#f2f2f5; word-break:break-all; }
  .count { margin-top:16px; background:#101016; border:1px solid #23232c; border-radius:10px; padding:12px; text-align:center; }
  .count .num { font-size:30px; font-weight:800; line-height:1; }
  .count .lbl { color:#a7a7b3; font-size:12px; margin-top:4px; }
  .count.warn .num { color:#ffb020; }
  .count.dead .num { color:#ff4d4d; }
  footer { text-align:center; color:#6d6d78; font-size:12px; margin-top:26px; }
  #clock { color:#8e8e99; font-size:12px; text-align:center; margin-top:4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cek Status <span class="n">Netflix</span></h1>
    <p class="sub">Pantau masa aktif slot kamu di sini.</p>
    <p id="clock"></p>
  </header>
  <p class="summary" id="summary">Memuat…</p>
  <main id="cards"></main>
  <footer>Halaman pantauan resmi untuk pembeli. Simpan link ini untuk cek status kapan saja.</footer>
</div>
<script>
  var FALLBACK = [
    {"label":"TV 1","holder":"Cak Ali","email":"ri***@riznetflik.my.id","profile":"CAK ALI","expiry":"2026-12-17","status":"LIVE"},
    {"label":"TV 2","holder":"Cak Ali","email":"sa***@gmail.com","profile":"CAK ALI","expiry":"2026-12-07","status":"LIVE"},
    {"label":"TV 3","holder":"Cak Ali","email":"tx***@gmail.com","profile":"CAK ALI","expiry":"2026-12-07","status":"LIVE"}
  ];
  function daysLeft(iso) {
    var now = new Date(); var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var p = iso.split("-"); var exp = new Date(+p[0], +p[1]-1, +p[2]);
    return Math.round((exp - today) / 86400000);
  }
  function fmtDate(iso) {
    var bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    var p = iso.split("-");
    return (+p[2]) + " " + bulan[+p[1]-1] + " " + p[0];
  }
  function render(slots) {
    var main = document.getElementById("cards");
    var aktif = 0, nearest = null;
    main.innerHTML = "";
    slots.forEach(function(s) {
      var live = (s.status || "LIVE").toUpperCase() === "LIVE";
      if (live) aktif++;
      var d = daysLeft(s.expiry);
      if (nearest === null || d < nearest) nearest = d;
      var cls = d < 0 ? "dead" : (d <= 7 ? "warn" : "");
      var countHtml = d < 0
        ? '<div class="num">EXPIRED</div><div class="lbl">sudah lewat ' + Math.abs(d) + ' hari</div>'
        : '<div class="num">' + d + '</div><div class="lbl">hari lagi</div>';
      var card = document.createElement("section");
      card.className = "card";
      card.innerHTML =
        '<div class="row1"><span class="slot">' + s.label + '</span>' +
        '<span class="badge' + (live ? "" : " off") + '"><span class="dot"></span>' + (live ? "LIVE" : "OFF") + '</span></div>' +
        '<div class="grid">' +
        '<div><div class="k">Pemegang</div><div class="v">' + s.holder + '</div></div>' +
        '<div><div class="k">Profil</div><div class="v">' + s.profile + '</div></div>' +
        '<div><div class="k">Email</div><div class="v">' + s.email + '</div></div>' +
        '<div><div class="k">Berakhir</div><div class="v">' + fmtDate(s.expiry) + '</div></div>' +
        '</div>' +
        '<div class="count ' + cls + '">' + countHtml + '</div>';
      main.appendChild(card);
    });
    document.getElementById("summary").innerHTML =
      "<b>" + aktif + " dari " + slots.length + " slot aktif</b>" +
      (nearest !== null ? " &middot; exp terdekat " + (nearest < 0 ? "sudah lewat" : nearest + " hari lagi") : "");
  }
  function tick() {
    var n = new Date();
    var pad = function(x){ return (x<10?"0":"") + x; };
    document.getElementById("clock").textContent =
      pad(n.getDate()) + "/" + pad(n.getMonth()+1) + "/" + n.getFullYear() + " " +
      pad(n.getHours()) + ":" + pad(n.getMinutes()) + ":" + pad(n.getSeconds());
  }
  tick(); setInterval(tick, 1000);
  fetch("slots.json", {cache: "no-store"})
    .then(function(r){ if (!r.ok) throw new Error("no json"); return r.json(); })
    .then(render)
    .catch(function(){ render(FALLBACK); });
</script>
</body>
</html>
